<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Settings | AI Capstone Project</title>
    <link rel="stylesheet" href="/css/settings.css" />
  </head>
  <body>
    <main class="page">
      <header class="page-header">
        <h1>Settings</h1>
        <p>Manage your profile, preferences, and AI features.</p>
      </header>

      <section class="settings-card">
        <form id="settings-form" class="settings-form" novalidate>
          <div class="form-section">
            <h2>Profile</h2>

            <div class="field">
              <label for="displayName">Display name</label>
              <input
                id="displayName"
                name="displayName"
                type="text"
                autocomplete="name"
                placeholder="Your name"
              />
            </div>

            <div class="field">
              <label for="email">Email</label>
              <input
                id="email"
                name="email"
                type="email"
                autocomplete="email"
                placeholder="you@example.com"
              />
            </div>
          </div>

          <div class="form-section">
            <h2>Preferences</h2>

            <div class="field">
              <label for="theme">Theme</label>
              <select id="theme" name="theme">
                <option value="system">System default</option>
                <option value="light">Light</option>
                <option value="dark">Dark</option>
              </select>
            </div>

            <div class="field">
              <label for="language">Language</label>
              <select id="language" name="language">
                <option value="en">English</option>
                <option value="es">Spanish</option>
                <option value="fr">French</option>
              </select>
            </div>
          </div>

          <div class="form-section">
            <h2>Notifications &amp; AI</h2>

            <label class="field checkbox-field">
              <input id="emailNotifications" name="emailNotifications" type="checkbox" />
              <span>
                <strong>Email notifications</strong>
                <small>Receive updates about project activity.</small>
              </span>
            </label>

            <label class="field checkbox-field">
              <input id="aiAssistEnabled" name="aiAssistEnabled" type="checkbox" />
              <span>
                <strong>AI assist</strong>
                <small>Enable AI-powered suggestions while you work.</small>
              </span>
            </label>
          </div>

          <div class="form-actions">
            <p id="status" class="status" role="status" aria-live="polite"></p>
            <button id="reset-btn" class="btn-secondary" type="button">Reset</button>
            <button id="save-btn" class="btn-primary" type="submit">Save settings</button>
          </div>
        </form>
      </section>
    </main>

    <script src="/js/settings.js"></script>
  </body>
</html>
